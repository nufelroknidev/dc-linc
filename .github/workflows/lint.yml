name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Syntax & import check
        run: |
          # E9xx = syntax errors, F821 = undefined names, F401 = unused imports
          flake8 . --count --select=E9,F821,F401 --show-source --statistics \
            --exclude=.git,outputs,docs,.materials
